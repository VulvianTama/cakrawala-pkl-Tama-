info:
  name: Verify Office
  type: http
  seq: 3
  tags:
    - offices

http:
  method: PATCH
  url: "{{baseUrl}}/offices/:id/verify"
  params:
    - name: id
      value: "{{officeId}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "is_verified": true
      }
  auth:
    type: bearer
    token: "{{teacherToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Teacher/Admin verifies an unverified office location and profile so that it enters the official verified directory.
