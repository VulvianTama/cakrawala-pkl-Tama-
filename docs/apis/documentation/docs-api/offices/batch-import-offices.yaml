info:
  name: Batch Import Offices (CSV)
  type: http
  seq: 4
  tags:
    - offices

http:
  method: POST
  url: "{{baseUrl}}/offices/batch"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: "offices-sample.csv"
  auth:
    type: bearer
    token: "{{teacherToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Batch inserts offices from an uploaded CSV file. Restricted to Teacher/Admin.
