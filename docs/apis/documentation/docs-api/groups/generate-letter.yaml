info:
  name: Generate and Sign Request Letter
  type: http
  seq: 7
  tags:
    - groups
    - letters

http:
  method: POST
  url: "{{baseUrl}}/groups/:id/letters/generate"
  params:
    - name: id
      value: "{{groupId}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "signature_type": "canvas",
        "signature_data": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
      }
  auth:
    type: bearer
    token: "{{teacherToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Generates an official PKL request letter from the DOCX template stored in `settings (letter.template)`.
  Requires Teacher signature (canvas base64 or 1:1 QR code). Uploads the resulting PDF to S3 `request_letters/*`.
