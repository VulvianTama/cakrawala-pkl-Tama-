info:
  name: Batch Import Teachers (CSV)
  type: http
  seq: 4
  tags:
    - users

http:
  method: POST
  url: "{{baseUrl}}/teachers/batch"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: "teachers-sample.csv"
  auth:
    type: bearer
    token: "{{teacherToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Batch imports teacher accounts from a CSV file. Teacher/Admin only.
