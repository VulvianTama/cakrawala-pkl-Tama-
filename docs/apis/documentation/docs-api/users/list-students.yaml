info:
  name: List Students
  type: http
  seq: 1
  tags:
    - users

http:
  method: GET
  url: "{{baseUrl}}/students"
  params:
    - name: limit
      value: "30"
      type: query
    - name: id_next
      value: ""
      type: query
    - name: search
      value: ""
      type: query
    - name: has_group
      value: "false"
      type: query
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.list
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Lists students with pagination (30 items default), search, and `has_group` filter (useful when inviting friends).
  Returns list envelope:
  ```json
  {
    "list": [
      {
        "id": "...",
        "username": "...",
        "full_name": "...",
        "class_name": "XII RPL 1",
        "has_group": false
      }
    ],
    "id_next": null
  }
  ```
