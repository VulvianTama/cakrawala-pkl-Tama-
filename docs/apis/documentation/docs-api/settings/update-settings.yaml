info:
  name: Update System Settings
  type: http
  seq: 2
  tags:
    - settings

http:
  method: PUT
  url: "{{baseUrl}}/settings/:type"
  params:
    - name: type
      value: "group.rules"
      type: path
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "content": {
          "min_students": 2,
          "max_students": 5
        }
      }
  auth:
    type: bearer
    token: "{{teacherToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Updates settings payload (e.g., minimum and maximum student boundaries for PKL groups). Admin/Teacher only.
